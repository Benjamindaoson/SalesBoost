apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesboost-backend
  labels:
    app: salesboost
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: salesboost
      component: backend
  template:
    metadata:
      labels:
        app: salesboost
        component: backend
    spec:
      containers:
      - name: backend
        image: salesboost/backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENV_STATE
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: salesboost-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: salesboost-secrets
              key: redis-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: salesboost-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: salesboost-backend
  labels:
    app: salesboost
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: salesboost
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salesboost-frontend
  labels:
    app: salesboost
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salesboost
      component: frontend
  template:
    metadata:
      labels:
        app: salesboost
        component: frontend
    spec:
      containers:
      - name: frontend
        image: salesboost/frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: salesboost-frontend
  labels:
    app: salesboost
    component: frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: salesboost
    component: frontend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: salesboost-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: salesboost-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

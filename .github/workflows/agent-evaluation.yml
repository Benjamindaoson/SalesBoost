name: Agent Evaluation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/autonomous-sales-agent-upgrade ]

jobs:
  agent-evaluation:
    name: Agent Evaluation Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run agent regression tests
        run: |
          cd backend
          pytest tests/test_autonomous_sales_upgrade.py -v

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课程管理 - 销冠AI系统管理端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:#fff;border-right:1px solid #e8e8e8;padding:20px 0;position:fixed;height:100vh;overflow-y:auto}
.logo{padding:0 20px 30px;display:flex;align-items:center;gap:12px}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#667eea,#764ba2);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:20px}
.menu-section{margin-bottom:8px}
.menu-title{padding:8px 20px;font-size:12px;color:#999;font-weight:500}
.menu-item{padding:12px 20px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .3s;color:#666;font-size:14px;margin:2px 12px;border-radius:8px}
.menu-item:hover,.menu-item.active{background:#f0f2ff;color:#667eea}
.menu-icon{width:20px;text-align:center}
.main{flex:1;margin-left:260px;padding:24px 32px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.header h1{font-size:24px;color:#1a1a1a}
.btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px}
.btn-primary{background:#667eea;color:#fff}
.btn-default{background:#fff;border:1px solid #d9d9d9;color:#666}
.tabs{display:flex;gap:8px;margin-bottom:20px;border-bottom:2px solid #f0f0f0;padding-bottom:12px}
.tab{padding:10px 20px;cursor:pointer;border-radius:8px;font-size:14px;color:#666;position:relative}
.tab.active{color:#667eea;font-weight:500}
.tab.active::after{content:'';position:absolute;bottom:-14px;left:0;right:0;height:2px;background:#667eea}
.content-layout{display:grid;grid-template-columns:280px 1fr;gap:24px}
.sidebar-menu{background:#fff;border-radius:12px;padding:16px}
.menu-list-item{padding:12px 16px;cursor:pointer;border-radius:8px;margin-bottom:4px;font-size:14px}
.menu-list-item:hover,.menu-list-item.active{background:#f0f2ff;color:#667eea}
.content-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.course-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid #f0f0f0}
.course-image{height:140px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;position:relative}
.course-icon{font-size:48px;opacity:0.3}
.course-body{padding:16px}
.course-title{font-size:15px;font-weight:600;margin-bottom:8px;color:#1a1a1a}
.course-desc{font-size:13px;color:#666;line-height:1.5;margin-bottom:12px;height:40px;overflow:hidden}
.course-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#999;margin-bottom:12px}
.course-actions{display:flex;gap:8px}
.btn-sm{padding:6px 16px;font-size:13px}
.btn-outline{background:transparent;border:1px solid #667eea;color:#667eea}
</style>
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo">
<div class="logo-icon">AI</div>
<div>
<h2 style="font-size:16px">销冠AI系统</h2>
<div style="font-size:12px;color:#999">管理端控制台</div>
</div>
</div>
<div class="menu-section">
<div class="menu-title">统一培训</div>
<div class="menu-item active">
<span class="menu-icon">📚</span>
<span>课程管理</span>
</div>
<div class="menu-item">
<span class="menu-icon">📋</span>
<span>任务管理</span>
</div>
<div class="menu-item">
<span class="menu-icon">📊</span>
<span>能力分析</span>
</div>
<div class="menu-item">
<span class="menu-icon">📖</span>
<span>知识管理</span>
</div>
</div>
</div>
<div class="main">
<div class="header">
<div>
<h1>课程管理</h1>
<div style="color:#999;font-size:14px">管理培训课程和内容</div>
</div>
<div style="display:flex;gap:12px">
<button class="btn btn-default" onclick="location.href='/'">切换到学员端</button>
<button class="btn btn-primary">+ 新建课程</button>
</div>
</div>
<div class="tabs">
<div class="tab">定制课程</div>
<div class="tab active">定制角色</div>
</div>
<div class="content-layout">
<div class="sidebar-menu">
<div style="font-weight:600;margin-bottom:16px">目录</div>
<div class="menu-list-item active">全部课程</div>
<div class="menu-list-item" style="padding-left:32px">运通联名高尔夫白金卡</div>
<div class="menu-list-item" style="padding-left:48px">新客户开卡场景训练</div>
<div class="menu-list-item" style="padding-left:48px">异议处理训练</div>
<div class="menu-list-item" style="padding-left:32px">百夫长卡</div>
<div class="menu-list-item" style="padding-left:32px">Visa全币种卡</div>
</div>
<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
<select style="padding:8px 16px;border:1px solid #d9d9d9;border-radius:6px">
<option>请选择创建人</option>
</select>
<button class="btn btn-primary">+ 定制角色</button>
</div>
<div class="course-grid">
<div class="course-card">
<div class="course-image">
<span class="course-icon">👤</span>
</div>
<div class="course-body">
<div class="course-title">刘先生</div>
<div class="course-desc">27岁，互联网行业程序员，商旅需求高，对信用卡权益比较关注</div>
<div class="course-meta">
<span>👤 张明</span>
<span>今天 17:29</span>
</div>
<div class="course-actions">
<button class="btn btn-default btn-sm">编辑</button>
<button class="btn btn-default btn-sm">详情</button>
</div>
</div>
</div>
<div class="course-card">
<div class="course-image">
<span class="course-icon">👤</span>
</div>
<div class="course-body">
<div class="course-title">王女士</div>
<div class="course-desc">35岁，金融行业，有家庭，关注子女教育和家庭理财规划</div>
<div class="course-meta">
<span>👤 李华</span>
<span>今天 15:20</span>
</div>
<div class="course-actions">
<button class="btn btn-default btn-sm">编辑</button>
<button class="btn btn-default btn-sm">详情</button>
</div>
</div>
</div>
<div class="course-card">
<div class="course-image">
<span class="course-icon">👤</span>
</div>
<div class="course-body">
<div class="course-title">李总</div>
<div class="course-desc">42岁，企业高管，追求高端服务和品质，对白金卡权益感兴趣</div>
<div class="course-meta">
<span>👤 王芳</span>
<span>昨天 23:16</span>
</div>
<div class="course-actions">
<button class="btn btn-default btn-sm">编辑</button>
<button class="btn btn-default btn-sm">详情</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>

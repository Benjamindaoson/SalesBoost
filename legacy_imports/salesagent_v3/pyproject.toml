[tool.poetry]
name = "salesagent-v3"
version = "3.0.0"
description = "Autonomous Sales Agent Engine — Multi-Agent Decision System with Visualization Platform"
authors = ["SalesAgent Team"]
readme = "README.md"
packages = [{include = "salesagent"}]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.12"

# LangGraph / LangChain
langgraph = "^0.2.0"
langchain = "^0.3.0"
langchain-core = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-anthropic = "^0.3.0"
langsmith = "^0.1.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pgvector = "^0.3.0"
psycopg2-binary = "^2.9.0"

# Redis
redis = {extras = ["hiredis"], version = "^5.0.0"}

# Pydantic / settings
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# LLM providers
anthropic = "^0.40.0"
openai = "^1.56.0"

# ML / embeddings
sentence-transformers = "^3.3.0"
torch = "^2.5.0"
numpy = "^1.26.0"
scikit-learn = "^1.5.0"

# File processing
pypdf2 = "^3.0.0"
python-docx = "^1.1.0"
tiktoken = "^0.8.0"

# Object storage
minio = "^7.2.0"

# Observability
opentelemetry-sdk = "^1.28.0"
opentelemetry-api = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"

# Utilities
httpx = "^0.27.0"
tenacity = "^9.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
python-dotenv = "^1.0.0"
structlog = "^24.4.0"
rich = "^13.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.27.0"
faker = "^30.0.0"
mypy = "^1.13.0"
ruff = "^0.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: salesagent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesagent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-salesagent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesagent -d salesagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - salesagent-network

  redis:
    image: redis:7-alpine
    container_name: salesagent_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - salesagent-network

  minio:
    image: minio/minio:latest
    container_name: salesagent_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - salesagent-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: salesagent_api
    environment:
      # Application
      APP_NAME: SalesAgent
      APP_VERSION: 3.0.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-salesagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesagent_secret}
      POSTGRES_DB: ${POSTGRES_DB:-salesagent}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}

      # LLM API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MOCK_LLM: ${MOCK_LLM:-true}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-secret-key-change-in-production}

      # Telemetry
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://jaeger:4317}
      SENTRY_DSN: ${SENTRY_DSN:-}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - salesagent-network

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: salesagent_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    restart: unless-stopped
    networks:
      - salesagent-network
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  salesagent-network:
    driver: bridge
